[project]
name = "finguard-mcp-bridge"
version = "0.1.0"
description = "Local STDIO read-only capability bridge; no Core credentials"
requires-python = ">=3.12,<3.13"
dependencies = ["mcp==1.30.0"]

[dependency-groups]
dev = ["pytest>=9.0.3,<10"]

[project.scripts]
finguard-mcp-bridge = "finguard_mcp_bridge.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finguard_mcp_bridge"]
