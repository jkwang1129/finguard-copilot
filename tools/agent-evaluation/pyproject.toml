[project]
name = "finguard-agent-evaluation"
version = "0.1.0"
description = "Offline evaluation contracts and dataset tooling for FinGuard Copilot"
requires-python = ">=3.12,<3.13"
dependencies = [
    "jsonschema>=4.25,<5",
    "langgraph>=1.0,<2",
    "pandas>=2.3,<3",
    "pydantic>=2.12,<3",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3,<10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finguard_agent_evaluation"]

[tool.pytest.ini_options]
testpaths = ["tests"]
