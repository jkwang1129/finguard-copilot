[project]
name = "finguard-semantic-embedding"
version = "0.1.0"
description = "Pinned, loopback-only local E5 ONNX inference for opt-in evaluation"
requires-python = ">=3.12,<3.13"
dependencies = ["onnxruntime==1.23.2", "tokenizers==0.22.1", "numpy==2.3.4"]

[project.scripts]
finguard-semantic = "finguard_semantic_embedding.__main__:main"

[dependency-groups]
dev = ["pytest==9.0.3"]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finguard_semantic_embedding"]

[tool.pytest.ini_options]
testpaths = ["tests"]
