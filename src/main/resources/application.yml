spring:
  application:
    name: finguard-copilot
  data:
    redis:
      host: ${COPILOT_REDIS_HOST:localhost}
      port: ${COPILOT_REDIS_PORT:6379}
      password: ${COPILOT_REDIS_PASSWORD:}
      timeout: ${COPILOT_REDIS_TIMEOUT:2s}
      connect-timeout: ${COPILOT_REDIS_CONNECT_TIMEOUT:2s}
  datasource:
    url: ${COPILOT_DB_URL}
    username: ${COPILOT_DB_USERNAME}
    password: ${COPILOT_DB_PASSWORD}
  flyway:
    enabled: true
  jpa:
    open-in-view: false

server:
  shutdown: graceful

management:
  health:
    redis:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,prometheus

finguard:
  copilot:
    core:
      base-url: ${FINGUARD_CORE_BASE_URL:http://localhost:8080}
    model:
      provider: ${COPILOT_MODEL_PROVIDER:}
      model-id: ${COPILOT_MODEL_ID:}
      base-url: ${COPILOT_MODEL_BASE_URL:}
      api-key: ${COPILOT_MODEL_API_KEY:}
      chat-completions-path: ${COPILOT_MODEL_CHAT_COMPLETIONS_PATH:}
      input-token-limit: ${COPILOT_MODEL_INPUT_TOKEN_LIMIT:32000}
      output-token-limit: ${COPILOT_MODEL_OUTPUT_TOKEN_LIMIT:2000}
      timeout: ${COPILOT_MODEL_TIMEOUT:20s}
      price-table-version: ${COPILOT_PRICE_TABLE_VERSION:unset}
      currency: ${COPILOT_MODEL_CURRENCY:USD}
      input-price-per-million: ${COPILOT_MODEL_INPUT_PRICE_PER_MILLION:0}
      output-price-per-million: ${COPILOT_MODEL_OUTPUT_PRICE_PER_MILLION:0}
    prompt:
      version: ${COPILOT_PROMPT_VERSION:review-analysis-v1}
    governance:
      fixture-mode: ${COPILOT_GOVERNANCE_FIXTURE_MODE:false}
      max-call-cny: ${COPILOT_MAX_CALL_CNY:0.10}
      max-reviewer-daily-cny: ${COPILOT_MAX_REVIEWER_DAILY_CNY:1}
      max-provider-daily-cny: ${COPILOT_MAX_PROVIDER_DAILY_CNY:10}
      max-global-daily-cny: ${COPILOT_MAX_GLOBAL_DAILY_CNY:10}
      price-valid-from: ${COPILOT_PRICE_VALID_FROM:2026-11-02T00:00:00Z}
      price-valid-until: ${COPILOT_PRICE_VALID_UNTIL:2026-12-02T00:00:00Z}
      permits:
        provider-concurrency: ${COPILOT_PROVIDER_CONCURRENCY:2}
        reviewer-per-minute: ${COPILOT_REVIEWER_PER_MINUTE:10}
    budget:
      max-input-tokens: ${COPILOT_MAX_INPUT_TOKENS:32000}
      max-output-tokens: ${COPILOT_MAX_OUTPUT_TOKENS:2000}
      max-model-calls: ${COPILOT_MAX_MODEL_CALLS:1}
    embedding:
      dimensions: ${COPILOT_EMBEDDING_DIMENSIONS:8}
    retrieval:
      top-k: ${COPILOT_RETRIEVAL_TOP_K:5}
    jobs:
      enabled: ${COPILOT_JOBS_ENABLED:false}
      batch-size: ${COPILOT_JOBS_BATCH_SIZE:100}
      snapshot-retention: ${COPILOT_SNAPSHOT_RETENTION:30d}
      published-outbox-retention: ${COPILOT_PUBLISHED_OUTBOX_RETENTION:7d}
      fixed-delay: ${COPILOT_JOBS_FIXED_DELAY:1h}

---
spring:
  config:
    activate:
      on-profile: "real-model | real-qwen | real-deepseek | real-zhipu"
management:
  health:
    redis:
      enabled: true
