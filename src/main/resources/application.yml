spring:
  application:
    name: finguard-copilot
  datasource:
    url: ${COPILOT_DB_URL}
    username: ${COPILOT_DB_USERNAME}
    password: ${COPILOT_DB_PASSWORD}
  flyway:
    enabled: true
  jpa:
    open-in-view: false

server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus

finguard:
  copilot:
    core:
      base-url: ${FINGUARD_CORE_BASE_URL:http://localhost:8080}
    embedding:
      dimensions: ${COPILOT_EMBEDDING_DIMENSIONS:8}
    retrieval:
      top-k: ${COPILOT_RETRIEVAL_TOP_K:5}
    jobs:
      enabled: ${COPILOT_JOBS_ENABLED:false}
      batch-size: ${COPILOT_JOBS_BATCH_SIZE:100}
      snapshot-retention: ${COPILOT_SNAPSHOT_RETENTION:30d}
      published-outbox-retention: ${COPILOT_PUBLISHED_OUTBOX_RETENTION:7d}
      fixed-delay: ${COPILOT_JOBS_FIXED_DELAY:1h}
