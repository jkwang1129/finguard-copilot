name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  java:
    runs-on: ubuntu-latest
    env:
      MAVEN_OPTS: -Xmx256m
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Test Java service
        run: bash ./mvnw -B -ntp clean test -DargLine=-Xmx512m -Dspring.test.context.cache.maxSize=1

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/agent-evaluation
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: |
            tools/agent-evaluation/uv.lock
            tools/mcp-bridge/uv.lock
      - name: Sync locked Python dependencies
        run: uv sync --locked
      - name: Test evaluation toolkit
        run: uv run pytest -q
      - name: Test local STDIO bridge
        run: |
          uv sync --locked --project ../mcp-bridge
          uv run --project ../mcp-bridge pytest ../mcp-bridge/tests -q
      - name: Test semantic embedding runtime offline contracts
        run: |
          uv sync --locked --project ../semantic-embedding
          uv run --project ../semantic-embedding pytest ../semantic-embedding/tests --ignore=../semantic-embedding/tests/test_real_runtime.py -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test -- --run
      - run: npm run build

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
