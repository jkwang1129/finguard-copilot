resolver 127.0.0.11 valid=5s ipv6=off;

upstream langfuse_web {
    zone langfuse_web 64k;
    server langfuse:3000 resolve;
}

server {
    listen 127.0.0.1:14318;

    location = /api/public/otel/v1/traces {
        proxy_pass http://langfuse_web;
        proxy_set_header Host langfuse;
        proxy_connect_timeout 1s;
        proxy_read_timeout 2s;
    }

    location / {
        return 404;
    }
}
