services:
  web:
    ports: !reset []
    environment:
      NEXTAUTH_URL: http://127.0.0.1:3000
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://minio:9000
    networks:
      default:
      integration:
        aliases: [langfuse]
  minio:
    ports: !reset []
networks:
  integration:
    name: ${FG_INTEGRATION_NETWORK:?set integration network}
    external: true
