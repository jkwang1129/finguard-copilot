server {
    listen 127.0.0.1:8081;
    access_log off;

    location = /healthz {
        return 204;
    }

    location ~ ^/api/copilot/review-analyses/[0-9a-f-]+/mcp-tools$ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host localhost;
    }

    location / {
        return 404;
    }
}
