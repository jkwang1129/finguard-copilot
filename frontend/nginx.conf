resolver 127.0.0.11 valid=5s ipv6=off;

upstream copilot_api {
    zone copilot_api 64k;
    server copilot:8080 resolve;
}

upstream core_api {
    zone core_api 64k;
    server core:8080 resolve;
}

server {
    listen 8080;
    root /usr/share/nginx/html;
    server_tokens off;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";

    location = /healthz {
        access_log off;
        return 204;
    }

    location /api/copilot/ {
        proxy_pass http://copilot_api;
        proxy_buffering off;
        proxy_read_timeout 75s;
    }

    location ~ ^/core-api/api/auth/(login|me)$ {
        rewrite ^/core-api(/.*)$ $1 break;
        proxy_pass http://core_api;
    }

    location /core-api/ {
        return 404;
    }

    location /api/ {
        return 404;
    }

    location /assets/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
